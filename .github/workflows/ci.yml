name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: confeccao
          POSTGRES_PASSWORD: confeccao
          POSTGRES_DB: confeccao
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U confeccao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://confeccao:confeccao@localhost:5432/confeccao?schema=public
      JWT_SECRET: ci-secret-only-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar cliente do banco
        run: npx prisma generate
        working-directory: apps/server
      - name: Aplicar migrações (valida o schema)
        run: npx prisma migrate deploy
        working-directory: apps/server
      - name: Verificar tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Seed (admin + base de exemplo)
        run: npm run db:seed:prod -w apps/server
        env:
          SEED_ADMIN_EMAIL: admin@ci.local
          SEED_ADMIN_PASSWORD: ci-password

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção
        run: docker build -t confeccao:ci .
