# Produção: app + PostgreSQL + Caddy (HTTPS automático com Let's Encrypt)
#
#   cp deploy/.env.prod.example deploy/.env.prod   # e preencha
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod exec app node dist/scripts/seed.js
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: confeccao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: confeccao
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U confeccao']
      interval: 5s
      retries: 10

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://confeccao:${POSTGRES_PASSWORD}@db:5432/confeccao?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      WEB_ORIGIN: https://${DOMAIN}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-5}
      VAPID_SUBJECT: mailto:${ADMIN_EMAIL}
      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: America/Sao_Paulo
    volumes:
      # Sessões do WhatsApp: precisam persistir (e ser mantidas em sigilo)
      - appdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
